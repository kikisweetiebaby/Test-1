<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiki's Little Corner</title>
  <style>
    :root {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#f7eff9; background:#17162b}
    * {box-sizing:border-box}
    body {margin:0; min-height:100vh; background:radial-gradient(circle at 25% 15%,#443153 0,transparent 42%),linear-gradient(145deg,#17162b,#272039); display:flex;flex-direction:column}
    nav {display:flex;justify-content:flex-end; gap:1.6rem; padding:30px 7%;font-size:.78rem;letter-spacing:.1em}
    nav a {color:#d5cae2;text-decoration:none}
    nav a:hover {color:#ffcee6}
    main {flex:1; display:flex;align-items:center;justify-content:center;text-align:center;padding:32px}
    .hero {max-width:650px}
    .sparkle {font-size:2.5rem}
    h1 {font-size:clamp(2.7rem,8vw,5rem);color:#ffd6ec;letter-spacing:-.05em;margin:12px 0}
    p {line-height:1.8;color:#e0d8e9;font-size:1.08rem}
    button {background:#e8a7cd;color:#28203c;border:0;border-radius:99px;padding:15px 27px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:25px;box-shadow:0 8px 32px #130e2266}
    button:hover {background:#f7c2e1;transform:translateY(-2px)}
    #message {min-height:2em;color:#ffd6ec;margin-top:23px}
    footer{text-align:center;color:#b5aac4;padding:25px;font-size:.82rem}
  </style>
</head>
<body>
  <nav><a href="#home">HOME</a><a href="#about">ABOUT</a><a href="mailto:hello@example.com" id="contact">CONTACT</a></nav>
  <main id="home"><section class="hero" id="about">
    <div class="sparkle" aria-hidden="true">✨</div>
    <h1>Hello, I'm Kiki</h1>
    <p>Welcome to my little corner of the internet.<br>Dream a little, create a lot, and enjoy the journey.</p>
    <button id="explore" type="button">Explore More →</button>
    <p id="message" aria-live="polite"></p>
  </section></main>
  <footer>Made with ♥ and a little AI magic</footer>
  <script>
    document.getElementById('explore').addEventListener('click', () => {
      document.getElementById('message').textContent = '🌷 You just made your first website interactive!';
    });
    document.getElementById('contact').addEventListener('click', (event) => {
      event.preventDefault();
      document.getElementById('message').textContent = '💌 Contact details coming soon!';
    });
  </script>
</body>
</html>
